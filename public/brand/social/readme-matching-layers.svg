<svg width="800" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="320" rx="0" fill="#0a0a0a"/>

  <!-- Grid background -->
  <defs>
    <pattern id="mgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <rect x="0" y="0" width="1" height="40" fill="#141414"/>
      <rect x="0" y="0" width="40" height="1" fill="#141414"/>
    </pattern>
  </defs>
  <rect width="800" height="320" fill="url(#mgrid)"/>

  <!-- Header label -->
  <text x="400" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#525252" text-anchor="middle" letter-spacing="0.15em">MATCHING ENGINE</text>

  <!-- Layer 1: Exact -->
  <rect x="60" y="56" width="680" height="36" fill="#10b981" opacity="0.12"/>
  <rect x="60" y="56" width="4" height="36" fill="#10b981"/>
  <text x="80" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#10b981" letter-spacing="0.05em">LAYER 1</text>
  <text x="160" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a1a1a1">Exact Match</text>
  <text x="720" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#525252" text-anchor="end">amount == amount</text>

  <!-- Layer 2: Window -->
  <rect x="60" y="100" width="680" height="36" fill="#34d399" opacity="0.10"/>
  <rect x="60" y="100" width="4" height="36" fill="#34d399"/>
  <text x="80" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#34d399" letter-spacing="0.05em">LAYER 2</text>
  <text x="160" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a1a1a1">Window Match</text>
  <text x="720" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#525252" text-anchor="end">amount + date tolerance</text>

  <!-- Layer 3: Reference -->
  <rect x="60" y="144" width="680" height="36" fill="#f59e0b" opacity="0.10"/>
  <rect x="60" y="144" width="4" height="36" fill="#f59e0b"/>
  <text x="80" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#f59e0b" letter-spacing="0.05em">LAYER 3</text>
  <text x="160" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a1a1a1">Reference Match</text>
  <text x="720" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#525252" text-anchor="end">invoice # in description</text>

  <!-- Layer 4: Fuzzy -->
  <rect x="60" y="188" width="680" height="36" fill="#fbbf24" opacity="0.10"/>
  <rect x="60" y="188" width="4" height="36" fill="#fbbf24"/>
  <text x="80" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbbf24" letter-spacing="0.05em">LAYER 4</text>
  <text x="160" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a1a1a1">Fuzzy Match</text>
  <text x="720" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#525252" text-anchor="end">similarity scoring</text>

  <!-- Layer 5: Semantic -->
  <rect x="60" y="232" width="680" height="36" fill="#a855f7" opacity="0.10"/>
  <rect x="60" y="232" width="4" height="36" fill="#a855f7"/>
  <text x="80" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a855f7" letter-spacing="0.05em">LAYER 5</text>
  <text x="160" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a1a1a1">LLM Semantic</text>
  <text x="720" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#525252" text-anchor="end">AI reads both sides</text>

  <!-- Layer 7: Partial -->
  <rect x="60" y="276" width="680" height="36" fill="#fafafa" opacity="0.05"/>
  <rect x="60" y="276" width="4" height="36" fill="#737373"/>
  <text x="80" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#737373" letter-spacing="0.05em">LAYER 7</text>
  <text x="160" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a1a1a1">Partial Match</text>
  <text x="720" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#525252" text-anchor="end">n invoices = 1 payment</text>
</svg>
