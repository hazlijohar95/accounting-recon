<svg width="1920" height="480" viewBox="0 0 1920 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="480" fill="#0a0a0a"/>

  <!-- Left side: Logo and name -->
  <g transform="translate(120, 190)">
    <!-- Logo Mark -->
    <rect x="0" y="0" width="12" height="48" fill="#fafafa"/>
    <rect x="12" y="0" width="24" height="12" fill="#fafafa"/>
    <rect x="36" y="0" width="12" height="18" fill="#fafafa"/>
    <rect x="12" y="18" width="24" height="12" fill="#fafafa"/>
    <rect x="24" y="30" width="12" height="6" fill="#fafafa"/>
    <rect x="36" y="36" width="12" height="12" fill="#fafafa"/>

    <!-- Text -->
    <text x="72" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#fafafa" letter-spacing="0.05em">reconcile</text>
  </g>

  <!-- Right side: Tagline -->
  <text x="1800" y="250" font-family="system-ui, sans-serif" font-size="14" fill="#717171" text-anchor="end">Change the way you reconcile.</text>

  <!-- Bottom accent line -->
  <rect x="0" y="470" width="1920" height="10" fill="#fafafa"/>
</svg>
