<svg width="176" height="48" viewBox="0 0 176 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Full logo: R mark + lowercase "econcile" wordmark

    R mark: 8px strokes, content y=8 to y=40 (32px cap height)
    Wordmark: 5px strokes, x-height y=16 to y=40 (24px)

    Proper lowercase: e,c,o,n are shorter (x-height)
    Only l and i's dot reach ascender height (y=8)
  -->

  <!-- R Mark (48×48, 8px strokes) -->
  <rect x="8" y="8" width="8" height="32" fill="#fafafa"/>
  <rect x="16" y="8" width="16" height="8" fill="#fafafa"/>
  <rect x="32" y="8" width="8" height="12" fill="#fafafa"/>
  <rect x="16" y="20" width="16" height="8" fill="#fafafa"/>
  <rect x="24" y="28" width="8" height="4" fill="#fafafa"/>
  <rect x="32" y="32" width="8" height="8" fill="#fafafa"/>

  <!-- Lowercase wordmark starts at x=50 -->
  <!-- x-height letters: y=16 to y=40 (24px), 5px strokes, 5px counters -->

  <!-- Letter "e" @ x=50 -->
  <rect x="50" y="16" width="15" height="5" fill="#fafafa"/>
  <rect x="50" y="16" width="5" height="24" fill="#fafafa"/>
  <rect x="55" y="26" width="10" height="5" fill="#fafafa"/>
  <rect x="50" y="35" width="15" height="5" fill="#fafafa"/>

  <!-- Letter "c" @ x=68 -->
  <rect x="68" y="16" width="15" height="5" fill="#fafafa"/>
  <rect x="68" y="16" width="5" height="24" fill="#fafafa"/>
  <rect x="68" y="35" width="15" height="5" fill="#fafafa"/>

  <!-- Letter "o" @ x=86 -->
  <rect x="86" y="16" width="15" height="5" fill="#fafafa"/>
  <rect x="86" y="16" width="5" height="24" fill="#fafafa"/>
  <rect x="96" y="16" width="5" height="24" fill="#fafafa"/>
  <rect x="86" y="35" width="15" height="5" fill="#fafafa"/>

  <!-- Letter "n" @ x=104 -->
  <rect x="104" y="16" width="15" height="5" fill="#fafafa"/>
  <rect x="104" y="16" width="5" height="24" fill="#fafafa"/>
  <rect x="114" y="16" width="5" height="24" fill="#fafafa"/>

  <!-- Letter "c" @ x=122 -->
  <rect x="122" y="16" width="15" height="5" fill="#fafafa"/>
  <rect x="122" y="16" width="5" height="24" fill="#fafafa"/>
  <rect x="122" y="35" width="15" height="5" fill="#fafafa"/>

  <!-- Letter "i" @ x=140 (tittle at ascender, stem at x-height) -->
  <rect x="140" y="8" width="5" height="5" fill="#fafafa"/>
  <rect x="140" y="16" width="5" height="24" fill="#fafafa"/>

  <!-- Letter "l" @ x=148 (ascender - full height) -->
  <rect x="148" y="8" width="5" height="32" fill="#fafafa"/>

  <!-- Letter "e" @ x=156 -->
  <rect x="156" y="16" width="15" height="5" fill="#fafafa"/>
  <rect x="156" y="16" width="5" height="24" fill="#fafafa"/>
  <rect x="161" y="26" width="10" height="5" fill="#fafafa"/>
  <rect x="156" y="35" width="15" height="5" fill="#fafafa"/>
</svg>
