# Fly.io deployment configuration for Reconciled ML Service
# Deploy via: fly deploy

app = "reconciled-ml"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret environment variables
  # Secrets should be set via: fly secrets set KEY=value

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    path = "/health"
