<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5E5" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- Left side: Bank Statement representation -->
  <g transform="translate(80, 80)">
    <!-- Document -->
    <rect width="160" height="200" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
    <rect x="16" y="16" width="80" height="8" rx="2" fill="#000000"/>
    <text x="16" y="44" font-family="system-ui" font-size="10" fill="#666">Bank Statement</text>

    <!-- Transaction lines -->
    <rect x="16" y="60" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="76" width="100" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="120" y="76" width="24" height="6" rx="1" fill="#000000"/>

    <rect x="16" y="92" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="108" width="80" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="120" y="108" width="24" height="6" rx="1" fill="#000000"/>

    <rect x="16" y="124" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="140" width="90" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="120" y="140" width="24" height="6" rx="1" fill="#000000"/>

    <rect x="16" y="156" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="172" width="70" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="120" y="172" width="24" height="6" rx="1" fill="#000000"/>
  </g>

  <!-- Center: Connection/matching visualization -->
  <g transform="translate(260, 120)">
    <!-- Connection lines -->
    <path d="M 0 40 Q 40 40, 80 20" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
    <path d="M 0 72 Q 40 72, 80 60" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
    <path d="M 0 104 Q 40 104, 80 100" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
    <path d="M 0 136 Q 40 136, 80 140" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="4,4"/>

    <!-- Checkmarks on connections -->
    <circle cx="40" cy="30" r="10" fill="#000000"/>
    <path d="M35 30 L38 33 L45 26" stroke="white" stroke-width="2" fill="none"/>

    <circle cx="40" cy="66" r="10" fill="#000000"/>
    <path d="M35 66 L38 69 L45 62" stroke="white" stroke-width="2" fill="none"/>

    <circle cx="40" cy="102" r="10" fill="#000000"/>
    <path d="M35 102 L38 105 L45 98" stroke="white" stroke-width="2" fill="none"/>

    <circle cx="40" cy="138" r="10" fill="#666666"/>
    <text x="37" y="142" font-family="system-ui" font-size="12" fill="white">?</text>
  </g>

  <!-- Right side: Invoices representation -->
  <g transform="translate(360, 80)">
    <!-- Document -->
    <rect width="160" height="200" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
    <rect x="16" y="16" width="60" height="8" rx="2" fill="#000000"/>
    <text x="16" y="44" font-family="system-ui" font-size="10" fill="#666">Invoices</text>

    <!-- Invoice items -->
    <rect x="16" y="60" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="72" width="40" height="6" rx="1" fill="#000000"/>
    <rect x="64" y="72" width="60" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="128" y="72" width="16" height="6" rx="1" fill="#000000"/>

    <rect x="16" y="88" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="100" width="40" height="6" rx="1" fill="#000000"/>
    <rect x="64" y="100" width="50" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="128" y="100" width="16" height="6" rx="1" fill="#000000"/>

    <rect x="16" y="116" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="128" width="40" height="6" rx="1" fill="#000000"/>
    <rect x="64" y="128" width="55" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="128" y="128" width="16" height="6" rx="1" fill="#000000"/>

    <rect x="16" y="144" width="128" height="1" fill="#E0E0E0"/>
    <rect x="16" y="156" width="40" height="6" rx="1" fill="#000000"/>
    <rect x="64" y="156" width="45" height="6" rx="1" fill="#CCCCCC"/>
    <rect x="128" y="156" width="16" height="6" rx="1" fill="#000000"/>
  </g>

  <!-- Labels -->
  <text x="160" y="320" font-family="system-ui" font-size="12" fill="#666" text-anchor="middle">Cash Basis</text>
  <text x="300" y="320" font-family="system-ui" font-size="12" fill="#000" font-weight="600" text-anchor="middle">AI Matching</text>
  <text x="440" y="320" font-family="system-ui" font-size="12" fill="#666" text-anchor="middle">Accrual Basis</text>

  <!-- Bottom stats -->
  <g transform="translate(100, 340)">
    <rect width="100" height="40" rx="4" fill="#000000"/>
    <text x="50" y="18" font-family="system-ui" font-size="11" fill="white" text-anchor="middle">95%</text>
    <text x="50" y="32" font-family="system-ui" font-size="9" fill="#CCCCCC" text-anchor="middle">Match Rate</text>
  </g>

  <g transform="translate(250, 340)">
    <rect width="100" height="40" rx="4" fill="#333333"/>
    <text x="50" y="18" font-family="system-ui" font-size="11" fill="white" text-anchor="middle">5 Layers</text>
    <text x="50" y="32" font-family="system-ui" font-size="9" fill="#CCCCCC" text-anchor="middle">AI Matching</text>
  </g>

  <g transform="translate(400, 340)">
    <rect width="100" height="40" rx="4" fill="#666666"/>
    <text x="50" y="18" font-family="system-ui" font-size="11" fill="white" text-anchor="middle">10x Faster</text>
    <text x="50" y="32" font-family="system-ui" font-size="9" fill="#CCCCCC" text-anchor="middle">Than Manual</text>
  </g>
</svg>
