<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#FAFAFA"/>

  <!-- Header bar -->
  <rect width="600" height="48" fill="#000000"/>
  <text x="24" y="30" font-family="system-ui" font-size="14" fill="white" font-weight="600">Dashboard</text>
  <circle cx="560" cy="24" r="14" fill="#333333"/>

  <!-- Sidebar -->
  <rect y="48" width="60" height="352" fill="#F5F5F5"/>
  <rect x="16" y="72" width="28" height="28" rx="4" fill="#000000"/>
  <rect x="16" y="112" width="28" height="28" rx="4" fill="#E0E0E0"/>
  <rect x="16" y="152" width="28" height="28" rx="4" fill="#E0E0E0"/>
  <rect x="16" y="192" width="28" height="28" rx="4" fill="#E0E0E0"/>

  <!-- Stats cards -->
  <g transform="translate(80, 68)">
    <!-- Matched card -->
    <rect width="150" height="80" rx="8" fill="white" stroke="#E0E0E0"/>
    <text x="16" y="28" font-family="system-ui" font-size="11" fill="#666666">Matched</text>
    <text x="16" y="52" font-family="system-ui" font-size="24" fill="#000000" font-weight="600">156</text>
    <text x="16" y="68" font-family="system-ui" font-size="10" fill="#22C55E">83%</text>
  </g>

  <g transform="translate(245, 68)">
    <!-- Pending card -->
    <rect width="150" height="80" rx="8" fill="white" stroke="#E0E0E0"/>
    <text x="16" y="28" font-family="system-ui" font-size="11" fill="#666666">Pending</text>
    <text x="16" y="52" font-family="system-ui" font-size="24" fill="#000000" font-weight="600">23</text>
    <text x="16" y="68" font-family="system-ui" font-size="10" fill="#F59E0B">12%</text>
  </g>

  <g transform="translate(410, 68)">
    <!-- Suspense card -->
    <rect width="150" height="80" rx="8" fill="white" stroke="#E0E0E0"/>
    <text x="16" y="28" font-family="system-ui" font-size="11" fill="#666666">Suspense</text>
    <text x="16" y="52" font-family="system-ui" font-size="24" fill="#000000" font-weight="600">8</text>
    <text x="16" y="68" font-family="system-ui" font-size="10" fill="#EF4444">5%</text>
  </g>

  <!-- Chart area -->
  <g transform="translate(80, 168)">
    <rect width="320" height="180" rx="8" fill="white" stroke="#E0E0E0"/>
    <text x="16" y="28" font-family="system-ui" font-size="11" fill="#666666">Cash Flow (12 months)</text>

    <!-- Chart bars -->
    <rect x="30" y="140" width="16" height="40" fill="#000000"/>
    <rect x="54" y="120" width="16" height="60" fill="#000000"/>
    <rect x="78" y="100" width="16" height="80" fill="#000000"/>
    <rect x="102" y="80" width="16" height="100" fill="#000000"/>
    <rect x="126" y="70" width="16" height="110" fill="#000000"/>
    <rect x="150" y="90" width="16" height="90" fill="#000000"/>
    <rect x="174" y="110" width="16" height="70" fill="#333333"/>
    <rect x="198" y="130" width="16" height="50" fill="#333333"/>
    <rect x="222" y="120" width="16" height="60" fill="#333333"/>
    <rect x="246" y="105" width="16" height="75" fill="#333333"/>
    <rect x="270" y="95" width="16" height="85" fill="#333333"/>
    <rect x="294" y="85" width="16" height="95" fill="#333333"/>

    <!-- X-axis labels -->
    <text x="38" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">J</text>
    <text x="62" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">F</text>
    <text x="86" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">M</text>
    <text x="110" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">A</text>
    <text x="134" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">M</text>
    <text x="158" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">J</text>
    <text x="182" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">J</text>
    <text x="206" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">A</text>
    <text x="230" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">S</text>
    <text x="254" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">O</text>
    <text x="278" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">N</text>
    <text x="302" y="168" font-family="system-ui" font-size="8" fill="#999999" text-anchor="middle">D</text>
  </g>

  <!-- Donut chart -->
  <g transform="translate(415, 168)">
    <rect width="145" height="180" rx="8" fill="white" stroke="#E0E0E0"/>
    <text x="16" y="28" font-family="system-ui" font-size="11" fill="#666666">Expenses</text>

    <!-- Simple donut representation -->
    <circle cx="72" cy="95" r="45" fill="none" stroke="#000000" stroke-width="20" stroke-dasharray="113 170"/>
    <circle cx="72" cy="95" r="45" fill="none" stroke="#555555" stroke-width="20" stroke-dasharray="85 198" stroke-dashoffset="-113"/>
    <circle cx="72" cy="95" r="45" fill="none" stroke="#999999" stroke-width="20" stroke-dasharray="42 241" stroke-dashoffset="-198"/>
    <circle cx="72" cy="95" r="45" fill="none" stroke="#CCCCCC" stroke-width="20" stroke-dasharray="28 255" stroke-dashoffset="-240"/>

    <!-- Legend -->
    <rect x="16" y="150" width="8" height="8" fill="#000000"/>
    <text x="28" y="158" font-family="system-ui" font-size="8" fill="#666666">Payroll 45%</text>
    <rect x="80" y="150" width="8" height="8" fill="#555555"/>
    <text x="92" y="158" font-family="system-ui" font-size="8" fill="#666666">Operating 30%</text>
    <rect x="16" y="164" width="8" height="8" fill="#999999"/>
    <text x="28" y="172" font-family="system-ui" font-size="8" fill="#666666">Marketing 15%</text>
    <rect x="80" y="164" width="8" height="8" fill="#CCCCCC"/>
    <text x="92" y="172" font-family="system-ui" font-size="8" fill="#666666">Other 10%</text>
  </g>

  <!-- Activity feed -->
  <g transform="translate(80, 358)">
    <rect width="480" height="32" rx="4" fill="white" stroke="#E0E0E0"/>
    <circle cx="20" cy="16" r="6" fill="#22C55E"/>
    <text x="36" y="20" font-family="system-ui" font-size="10" fill="#666666">Matched INV-001 (2m ago) • Uploaded bank.pdf (5m ago) • Approved 12 matches (1h ago)</text>
  </g>
</svg>
